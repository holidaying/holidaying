<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="江湖虾客 · AI 全栈实践者">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.45" stop-color="#0e1930"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.45" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.45"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <ellipse cx="960" cy="180" rx="330" ry="230" fill="url(#glowCyan)"/>
  <ellipse cx="180" cy="330" rx="300" ry="200" fill="url(#glowViolet)"/>
  <ellipse cx="950" cy="265" rx="180" ry="150" fill="url(#glowAmber)"/>

  <!-- 外框 -->
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- 装饰圆环 -->
  <circle cx="1105" cy="86" r="66" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="1105" cy="86" r="104" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- 文字区 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',-apple-system,'Segoe UI',sans-serif">
    <text x="72" y="112" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="6" fill="#5f7896">GITHUB · PROFILE</text>

    <text x="70" y="196" font-size="76" font-weight="700" fill="url(#titleGrad)">江湖虾客</text>

    <rect x="72" y="216" width="230" height="3" rx="1.5" fill="url(#ruleGrad)"/>

    <text x="72" y="256" font-size="22" fill="#a9bdd8">AI 全栈实践者 · 从前端到模型，一个人跑通整条落地链路</text>

    <!-- 能力 chips -->
    <g font-size="15" fill="#cfe0f5">
      <rect x="72" y="292" width="78" height="32" rx="16" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="111" y="313" text-anchor="middle">Agent</text>

      <rect x="162" y="292" width="64" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.35"/>
      <text x="194" y="313" text-anchor="middle">RAG</text>

      <rect x="238" y="292" width="66" height="32" rx="16" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.35"/>
      <text x="271" y="313" text-anchor="middle">MCP</text>

      <rect x="316" y="292" width="98" height="32" rx="16" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="365" y="313" text-anchor="middle">Vue / TS</text>

      <rect x="426" y="292" width="104" height="32" rx="16" fill="#a5b4fc" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.30"/>
      <text x="478" y="313" text-anchor="middle">前端工程化</text>
    </g>
  </g>

  <!-- 智能体拓扑 -->
  <g stroke="#38bdf8" stroke-opacity="0.34" stroke-width="1.3" fill="none">
    <path d="M838 152 L906 112"/>
    <path d="M906 112 L968 172"/>
    <path d="M968 172 L1040 124"/>
    <path d="M1040 124 L1096 184"/>
    <path d="M838 152 L876 232"/>
    <path d="M876 232 L956 268"/>
    <path d="M968 172 L956 268"/>
    <path d="M956 268 L1046 244"/>
    <path d="M1046 244 L1096 184"/>
    <path d="M956 268 L812 302"/>
    <path d="M1046 244 L1112 292"/>
    <path d="M876 232 L812 302"/>
  </g>

  <!-- 数据流曲线：从文字区延伸到拓扑 -->
  <g fill="none" stroke-width="1.6" stroke-opacity="0.5">
    <path d="M560 306 C 660 306, 700 250, 792 236" stroke="#22d3ee"/>
    <path d="M560 300 C 700 300, 740 190, 838 154" stroke="#8b5cf6" stroke-opacity="0.42"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="956" cy="268" r="11" fill="#f59e0b"/>
    <circle cx="906" cy="112" r="8" fill="#22d3ee"/>
  </g>

  <g fill="#a5f3fc">
    <circle cx="838" cy="152" r="5.5" fill-opacity="0.9"/>
    <circle cx="968" cy="172" r="4.5" fill-opacity="0.8"/>
    <circle cx="1040" cy="124" r="6.5" fill-opacity="0.85"/>
    <circle cx="1096" cy="184" r="5" fill-opacity="0.75"/>
    <circle cx="876" cy="232" r="6" fill-opacity="0.85"/>
    <circle cx="1046" cy="244" r="5.5" fill-opacity="0.8"/>
    <circle cx="1112" cy="292" r="4" fill-opacity="0.7"/>
    <circle cx="812" cy="302" r="4.5" fill-opacity="0.7"/>
  </g>

  <!-- 主节点标注 -->
  <text x="956" y="300" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#fbbf24" fill-opacity="0.85">LLM</text>

  <!-- 右下角署名 -->
  <text x="1128" y="366" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#4d6484">@holidaying</text>
</svg>
